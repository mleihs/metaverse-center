name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Biome lint
        run: npm run lint

      - name: Lit template check
        run: npm run lint:lit

      - name: Color token lint
        run: bash frontend/scripts/lint-color-tokens.sh
        working-directory: .

      - name: Content quality lint
        run: bash frontend/scripts/lint-llm-content.sh
        working-directory: .

      - name: Navigation lint (no direct pushState)
        run: bash frontend/scripts/lint-no-pushstate.sh
        working-directory: .

      - name: API layer lint (no appState routing reads)
        run: bash frontend/scripts/lint-no-appstate-access-reads.sh
        working-directory: .

      - name: Error-handling lint (no empty-var catch)
        run: bash frontend/scripts/lint-no-empty-catch.sh
        working-directory: .

      - name: Type-safety lint (no `as unknown as T` casts)
        run: bash frontend/scripts/lint-no-cast-unknown.sh
        working-directory: .

      - name: Bureau Ops frame cascade-order lint
        run: bash frontend/scripts/lint-bureau-panel-frame-last.sh
        working-directory: .

      - name: Aptitude lint (no client-side baseline literals)
        run: bash frontend/scripts/lint-no-aptitude-baseline.sh
        working-directory: .

      - name: i18n lint (no conditionals inside message templates)
        run: bash frontend/scripts/lint-no-ternary-in-msg.sh
        working-directory: .

      # A backtick inside a css`...` block ends the template literal, and the
      # rest of the styles block is parsed as JavaScript. `biome check --write`
      # does not error on it - it silently rewrites the whole block.
      - name: CSS template lint (no stray backticks in css blocks)
        run: bash frontend/scripts/lint-no-backtick-in-css.sh
        working-directory: .

      # A coloured bar down one edge of a card is the single gesture that makes
      # an interface read as machine-assembled. Removed from 110 declarations
      # across 66 files; the vocabulary that replaces it lives in
      # components/shared/marker-styles.ts.
      - name: Marker lint (no coloured edge bars)
        run: bash frontend/scripts/lint-no-accent-edge-bar.sh
        working-directory: .

      # Guards the guards: a lint script whose grep target does not exist under
      # the caller's cwd prints PASS instead of failing. Six frontend gates were
      # silent no-ops in this very job until 2026-08-28.
      - name: Lint-gate anchoring (guards must not depend on cwd)
        run: bash scripts/lint-lint-scripts-anchored.sh
        working-directory: .

      - name: Backend lint (GenerationService._generate privacy)
        run: bash scripts/lint-no-private-generate.sh
        working-directory: .

      - name: Backend lint (no bilingual content in dungeon Python files)
        run: bash scripts/lint-no-content-in-python.sh
        working-directory: .

      - name: Backend lint (no unreachable guard after .single())
        run: bash scripts/lint-no-dead-single-guard.sh
        working-directory: .

      - name: Backend lint (test chain mock covers every postgrest method)
        run: bash scripts/lint-chain-mock-covers-postgrest.sh
        working-directory: .

  lint-backend:
    name: Lint Backend
    # Enforces the FULL ruff ruleset declared in pyproject.toml (E,F,W,I,N,UP,S,B,A,
    # C4,DTZ,T20,ICN,FAST). Until now the only ruff in CI was the security subset
    # (`--select S`, security.yml), so the remaining rules were enforced by nobody —
    # 164 violations had silently accumulated in scripts/ (dead imports, an undefined
    # name, a shell-injection call). This job is the gate that keeps the tree clean.
    # Mirrors lint-frontend: fast, no services, fails before the heavy test jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (full ruleset, backend + scripts)
        run: ruff check backend/ scripts/ --output-format github

  lock-backend:
    name: Backend Lock Divergence
    # backend/requirements.txt is the SHIPPED dependency set (the Dockerfile installs
    # it with --require-hashes); pyproject.toml is the single source of truth it is
    # compiled from. The 2026-07 deep audit (P1-4) found the two had silently diverged
    # (fastapi==0.135.1 shipped vs >=0.136.0 declared, zero hashes) — prod installed a
    # set that CI never tested and pip-audit never scanned. This job recompiles the
    # lock with the exact command documented in its header. uv reuses the committed
    # pins whenever they still satisfy pyproject, so a new upstream release does NOT
    # fail the build — only a pyproject edit without `uv pip compile`, or a hand-edited
    # lock, does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv (pinned — lock output must be byte-reproducible)
        run: pip install uv==0.11.16

      - name: Recompile lock from pyproject
        run: uv pip compile pyproject.toml --universal --python-version 3.13 --generate-hashes -o backend/requirements.txt

      - name: Fail on divergence
        run: git diff --exit-code -- backend/requirements.txt

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "http://localhost:54321"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      SUPABASE_JWT_SECRET: "super-secret-jwt-token-with-at-least-32-characters-long"
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase containers (no migrations, no seeds)
        # `supabase start` applies migrations + seeds via an embedded SQL
        # splitter that fails on certain valid PostgreSQL patterns
        # (observed with migration 214: SQLSTATE 42601 "cannot insert
        # multiple commands into a prepared statement", even though psql
        # applies the same file cleanly). We stash migrations and seeds
        # before start, bring up the containers, then apply both via
        # psql in subsequent steps — psql is the canonical Postgres
        # client and handles every file identically to local/prod.
        #
        # The `trap ... EXIT` ensures stashed files return to their
        # working-tree locations even if `supabase start` fails — without
        # it, a failed start would orphan every *.sql under /tmp/sql-stash
        # and subsequent debugging steps (or retries in the same runner)
        # would see an empty supabase/migrations directory.
        run: |
          mkdir -p /tmp/sql-stash/migrations /tmp/sql-stash/seed
          trap 'mv /tmp/sql-stash/migrations/*.sql supabase/migrations/ 2>/dev/null || true; mv /tmp/sql-stash/seed/*.sql supabase/seed/ 2>/dev/null || true; rm -rf /tmp/sql-stash' EXIT
          mv supabase/migrations/*.sql /tmp/sql-stash/migrations/
          mv supabase/seed/*.sql /tmp/sql-stash/seed/
          supabase start -x realtime,storage,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations and seeds via psql
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "[migrations] Applying $(basename "$f")..."
            psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
          # Seeds — config.toml pattern is ./seed/0*.sql (numeric-prefix only)
          for f in $(ls supabase/seed/0*.sql 2>/dev/null | sort); do
            echo "[seed] Applying $(basename "$f")..."
            psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Grant role table access (CI parity with Supabase provisioning)
        # The pinned-to-`latest` Supabase CLI's `supabase start` no longer grants
        # anon/authenticated/service_role the table + sequence access that the
        # project's prod and local databases were provisioned with, so the
        # service_role client hits "permission denied for table ..." across the
        # integration suite. Re-grant to match prod: RLS still gates anon /
        # authenticated; service_role bypasses RLS as designed. Routines are
        # deliberately NOT granted here — per-function EXECUTE is governed by the
        # migrations (ADR-006) and the SECDEF anon-RPC guard below.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q \
            -c "GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;" \
            -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;" \
            -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;"
          # The blanket grant above would silently undo every deny-by-grant table
          # the migrations set up (e.g. travel_run_seeds, migration 264, whose
          # secrecy model is "no anon/authenticated grant at all"). Replay all
          # table-level REVOKEs in migration order so the migrations stay the
          # single source of truth. Convention: table REVOKEs are single-line
          # statements in the migration files.
          grep -h -E '^REVOKE[^;]*ON TABLE[^;]*;' supabase/migrations/*.sql | \
            psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q

      - name: SECDEF anon-RPC grant guard (ADR-006)
        env:
          PGPASSWORD: postgres
        run: bash scripts/lint-no-secdef-public-grant.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Content packs validation
        run: |
          python scripts/validate_content_packs.py
          python scripts/validate_content_packs.py --domain drift --strict

      - name: Run tests with coverage
        run: python -m pytest --cov

  sentry-release:
    name: Sentry Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-frontend, test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Associate commits & register deploy
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          inject: false
