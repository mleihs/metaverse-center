name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `scripts/lint-no-em-dash-in-content.sh` liest Python ueber den
      # Tokenizer und braucht 3.12+, weil f-Strings erst dort als
      # FSTRING_MIDDLE erscheinen. Das Tor bricht auf aelteren Interpretern
      # laut ab; hier steht der Grund, warum es nie dazu kommt.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Biome lint
        run: npm run lint

      - name: Lit template check
        run: npm run lint:lit

      # CI hat den Produktions-Build nie gefahren — nur typecheck, lint und
      # Tests. Am 31.08.2026 brach ein Deploy an einem CSS-Kommentar, den
      # weder tsc noch biome noch eines der 25 Tore lesen konnte; der erste
      # Leser war `vite build` auf dem Deploy-Server, nach dem Start.
      # Ein Build, der nirgends probiert wird, ist eine Zusicherung.
      #
      # Läuft ohne Deploy-Geheimnisse: `assertDeployEnv` prüft nur, wenn
      # VELG_REQUIRE_BUILD_ENV=true gesetzt ist, und das setzt nur der
      # Deployment-Ziel-Container.
      - name: Production build (the reader that used to be the deploy server)
        run: npm run build

      - name: Color token lint
        run: bash frontend/scripts/lint-color-tokens.sh
        working-directory: .

      - name: Content quality lint
        run: bash frontend/scripts/lint-llm-content.sh
        working-directory: .

      - name: Navigation lint (no direct pushState)
        run: bash frontend/scripts/lint-no-pushstate.sh
        working-directory: .

      - name: API layer lint (no appState routing reads)
        run: bash frontend/scripts/lint-no-appstate-access-reads.sh
        working-directory: .

      - name: Error-handling lint (no empty-var catch)
        run: bash frontend/scripts/lint-no-empty-catch.sh
        working-directory: .

      - name: Type-safety lint (no `as unknown as T` casts)
        run: bash frontend/scripts/lint-no-cast-unknown.sh
        working-directory: .

      - name: Bureau Ops frame cascade-order lint
        run: bash frontend/scripts/lint-bureau-panel-frame-last.sh
        working-directory: .

      - name: Aptitude lint (no client-side baseline literals)
        run: bash frontend/scripts/lint-no-aptitude-baseline.sh
        working-directory: .

      - name: i18n lint (no conditionals inside message templates)
        run: bash frontend/scripts/lint-no-ternary-in-msg.sh
        working-directory: .

      # A backtick inside a css`...` block ends the template literal, and the
      # rest of the styles block is parsed as JavaScript. `biome check --write`
      # does not error on it - it silently rewrites the whole block.
      - name: CSS template lint (no stray backticks in css blocks)
        run: bash frontend/scripts/lint-no-backtick-in-css.sh
        working-directory: .
      - name: Lint - Avatar-Plakette setzt Grund und Tinte gemeinsam
        run: bash frontend/scripts/lint-avatar-ground-ink-pair.sh
        working-directory: .
      # Eine Inline-Box nimmt kein aspect-ratio an. Der Nachbar mit demselben
      # CSS und einem <div> im Markup sieht richtig aus — deshalb faellt es
      # weder beim Lesen noch im Browser auf, bis jemand den fehlenden Namen
      # meldet.
      - name: Lint - kein aspect-ratio auf einer Inline-Box
        run: bash frontend/scripts/lint-no-sized-inline-box.sh
        working-directory: .

      # A comment whose end lands in the wrong place turns the paragraph after
      # it into bare CSS. Nothing else here parses .css: tsc does not read it,
      # biome lints TypeScript, the token gate greps for raw hex, and the
      # backtick gate checks css`...` blocks inside TS. The only thing that
      # noticed was `vite build`, in production, after a deploy had started.
      - name: CSS parses (the check that only the production build used to do)
        run: node frontend/scripts/lint-css-parses.mjs
        working-directory: .

      # A coloured bar down one edge of a card is the single gesture that makes
      # an interface read as machine-assembled. Removed from 110 declarations
      # across 66 files; the vocabulary that replaces it lives in
      # components/shared/marker-styles.ts.
      # `working-directory: .` is not decoration: this job defaults to `frontend`,
      # so without it the step runs `bash frontend/frontend/scripts/...`, dies
      # with exit 127 before the script starts, and the gate has never once run
      # in CI. Every other gate step in this job carries the line; this one was
      # added without it.
      - name: Marker lint (no coloured edge bars)
        run: bash frontend/scripts/lint-no-accent-edge-bar.sh
        working-directory: .

      # `text-transform: uppercase` hard in a component is a word that shouts in
      # a room where nothing else does — as soon as a skin lowercases its
      # headings. Both role tokens default to `uppercase`, so the mistake is
      # INVISIBLE on the dark chrome; only a gate can see it. The sweep that
      # introduced the rule moved 1396 declarations; the plan that ordered it
      # estimated 400.
      - name: Typography lint (text-transform names its role)
        run: bash frontend/scripts/lint-no-hard-text-transform.sh
        working-directory: .

      # Binds the class the marker gate could not: a shared style module that is
      # copied by hand instead of imported. See the script header for the
      # measurement that set its thresholds.
      # `working-directory: .` fehlte hier, obwohl der Kommentar zwei Schritte
      # weiter oben genau diesen Fehler beschreibt: die Vorgabe dieses Jobs ist
      # `frontend`, ohne die Zeile sucht bash also `frontend/frontend/scripts/…`.
      - name: Shared-style lint (no hand-copied style modules)
        run: bash frontend/scripts/lint-no-shared-style-copy.sh
        working-directory: .
      - name: Lint — every dungeon verb is gated and documented
        run: bash frontend/scripts/lint-dungeon-verbs-gated.sh
        working-directory: .

      # Diese drei standen in `npm run lint:full` und liefen NICHT in CI. Ein Tor,
      # das nur lokal läuft, ist eine Bitte, keine Regel: es hält niemanden auf,
      # der es nicht von sich aus aufruft.
      - name: Lint — help numbers match their sources
        run: bash frontend/scripts/lint-help-numbers-measured.sh
        working-directory: .

      - name: Lint — every api client has a caller
        run: bash frontend/scripts/lint-no-dead-api-client.sh
        working-directory: .

      - name: Lint — every metric explanation answers all three questions
        run: bash frontend/scripts/lint-metric-explainer-complete.sh
        working-directory: .

      # Guards the guards: a lint script whose grep target does not exist under
      # the caller's cwd prints PASS instead of failing. Six frontend gates were
      # silent no-ops in this very job until 2026-08-28.
      - name: Lint-gate anchoring (guards must not depend on cwd)
        run: bash scripts/lint-lint-scripts-anchored.sh
        working-directory: .

      - name: Backend lint (GenerationService._generate privacy)
        run: bash scripts/lint-no-private-generate.sh
        working-directory: .

      - name: Backend lint (no bilingual content in dungeon Python files)
        run: bash scripts/lint-no-content-in-python.sh
        working-directory: .

      - name: Backend lint (migration timestamps unique, numbers in the same order)
        run: bash scripts/lint-migration-order.sh
        working-directory: .

      # psql liest bis zum Semikolon. Fehlt es hinter der schliessenden
      # Dollar-Marke einer Funktion, zieht es die naechste Anweisung mit hinein
      # und meldet den Fehler an einer Stelle, die mit der Ursache nichts zu tun
      # hat. Migration 319 trug das einen Tag lang unsichtbar, weil die
      # Migrationskette vorher abbrach und psql nie bis dorthin kam.
      - name: Backend lint (dollar-quoted blocks terminated)
        run: bash scripts/lint-migration-statements-terminated.sh
        working-directory: .

      - name: Backend lint (return type is the only source of the response shape)
        run: bash scripts/lint-no-response-model.sh
        working-directory: .

      - name: Backend lint (routers use get_effective_supabase)
        run: bash scripts/lint-effective-supabase-in-routers.sh
        working-directory: .

      - name: Backend lint (no unreachable guard after .single())
        run: bash scripts/lint-no-dead-single-guard.sh
        working-directory: .

      - name: Lint (server, type and label know the same roles)
        run: bash scripts/lint-role-vocabulary.sh
        working-directory: .

      # Die msg()-Seite hielt `frontend/scripts/lint-llm-content.sh` seit je.
      # Die andere Seite hatte kein Tor, und dort standen 1 253 Geviertstriche:
      # im Backend, in der Saat und in den Verlies-Paketen — allein 806 in
      # `ambient_weather_templates.py`, also in Text, den das Spiel woertlich
      # anzeigt. Ein Prompt mit Geviertstrichen bringt sie ausserdem dem Modell
      # bei, dessen Ausgabe wieder ein Leser bekommt.
      - name: Lint (kein Geviertstrich in Backend-Strings, Saat und Paketen)
        run: bash scripts/lint-no-em-dash-in-content.sh
        working-directory: .

      # Die Hilfe, der Bau-Editor und die Spezifikation nannten dieselbe
      # Zustands-Leiter, und alle drei nannten sie falsch: `Moderate` ist keine
      # Sprosse, `good` wiegt 0,85 statt 1,0. Einmal in der Hilfe korrigiert,
      # blieb der Satz an den beiden anderen Orten stehen — weil niemand
      # gefragt hat, wo er sonst noch steht. Das Tor bindet jede Angabe an das
      # Saatgut in Migration 031.
      - name: Frontend lint (Zustands-Leiter gegen die Taxonomie)
        run: bash scripts/lint-condition-ladder-matches-taxonomy.sh
        working-directory: .

      # Beide liefen bisher NUR in `lint:full` und damit nie in CI.
      - name: Frontend lint (keine HTML-Entities in den Uebersetzungen)
        run: bash frontend/scripts/lint-no-html-entities-in-locales.sh
        working-directory: .

      - name: Repo lint (Workflows parsen)
        run: bash scripts/lint-workflows-parse.sh
        working-directory: .

      # A pydantic-ai run raises ModelAPIError on a timeout — the PARENT of
      # ModelHTTPError, so `except ModelHTTPError` misses it, and no httpx/Key/
      # Type/ValueError tuple ever saw it. Fourteen handlers written to degrade
      # gracefully were blind to the failure they were written for.
      - name: Backend lint (model-call handlers catch model errors)
        run: bash scripts/lint-model-call-handlers.sh
        working-directory: .

  lint-backend:
    name: Lint Backend
    # Enforces the FULL ruff ruleset declared in pyproject.toml (E,F,W,I,N,UP,S,B,A,
    # C4,DTZ,T20,ICN,FAST). Until now the only ruff in CI was the security subset
    # (`--select S`, security.yml), so the remaining rules were enforced by nobody —
    # 164 violations had silently accumulated in scripts/ (dead imports, an undefined
    # name, a shell-injection call). This job is the gate that keeps the tree clean.
    # Mirrors lint-frontend: fast, no services, fails before the heavy test jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (full ruleset, backend + scripts)
        run: ruff check backend/ scripts/ --output-format github

  lock-backend:
    name: Backend Lock Divergence
    # backend/requirements.txt is the SHIPPED dependency set (the Dockerfile installs
    # it with --require-hashes); pyproject.toml is the single source of truth it is
    # compiled from. The 2026-07 deep audit (P1-4) found the two had silently diverged
    # (fastapi==0.135.1 shipped vs >=0.136.0 declared, zero hashes) — prod installed a
    # set that CI never tested and pip-audit never scanned. This job recompiles the
    # lock with the exact command documented in its header. uv reuses the committed
    # pins whenever they still satisfy pyproject, so a new upstream release does NOT
    # fail the build — only a pyproject edit without `uv pip compile`, or a hand-edited
    # lock, does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv (pinned — lock output must be byte-reproducible)
        run: pip install uv==0.11.16

      - name: Recompile lock from pyproject
        run: uv pip compile pyproject.toml --universal --python-version 3.13 --generate-hashes -o backend/requirements.txt

      - name: Fail on divergence
        run: git diff --exit-code -- backend/requirements.txt

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm test

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: "http://localhost:54321"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      SUPABASE_JWT_SECRET: "super-secret-jwt-token-with-at-least-32-characters-long"
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase containers (no migrations, no seeds)
        # `supabase start` applies migrations + seeds via an embedded SQL
        # splitter that fails on certain valid PostgreSQL patterns
        # (observed with migration 214: SQLSTATE 42601 "cannot insert
        # multiple commands into a prepared statement", even though psql
        # applies the same file cleanly). We stash migrations and seeds
        # before start, bring up the containers, then apply both via
        # psql in subsequent steps — psql is the canonical Postgres
        # client and handles every file identically to local/prod.
        #
        # The `trap ... EXIT` ensures stashed files return to their
        # working-tree locations even if `supabase start` fails — without
        # it, a failed start would orphan every *.sql under /tmp/sql-stash
        # and subsequent debugging steps (or retries in the same runner)
        # would see an empty supabase/migrations directory.
        run: |
          mkdir -p /tmp/sql-stash/migrations /tmp/sql-stash/seed
          trap 'mv /tmp/sql-stash/migrations/*.sql supabase/migrations/ 2>/dev/null || true; mv /tmp/sql-stash/seed/*.sql supabase/seed/ 2>/dev/null || true; rm -rf /tmp/sql-stash' EXIT
          mv supabase/migrations/*.sql /tmp/sql-stash/migrations/
          mv supabase/seed/*.sql /tmp/sql-stash/seed/
          supabase start -x realtime,storage,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Apply migrations and seeds via psql
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "[migrations] Applying $(basename "$f")..."
            psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
          # Seeds — config.toml pattern is ./seed/0*.sql (numeric-prefix only)
          for f in $(ls supabase/seed/0*.sql 2>/dev/null | sort); do
            echo "[seed] Applying $(basename "$f")..."
            psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Grant role table access (CI parity with Supabase provisioning)
        # The pinned-to-`latest` Supabase CLI's `supabase start` no longer grants
        # anon/authenticated/service_role the table + sequence access that the
        # project's prod and local databases were provisioned with, so the
        # service_role client hits "permission denied for table ..." across the
        # integration suite. Re-grant to match prod: RLS still gates anon /
        # authenticated; service_role bypasses RLS as designed. Routines are
        # deliberately NOT granted here — per-function EXECUTE is governed by the
        # migrations (ADR-006) and the SECDEF anon-RPC guard below.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q \
            -c "GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;" \
            -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;" \
            -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;"
          # The blanket grant above would silently undo every deny-by-grant table
          # the migrations set up (e.g. travel_run_seeds, migration 264, whose
          # secrecy model is "no anon/authenticated grant at all"). Replay all
          # table-level REVOKEs in migration order so the migrations stay the
          # single source of truth. Convention: table REVOKEs are single-line
          # statements in the migration files.
          grep -h -E '^REVOKE[^;]*ON TABLE[^;]*;' supabase/migrations/*.sql | \
            psql -h localhost -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -q

      - name: SECDEF anon-RPC grant guard (ADR-006)
        env:
          PGPASSWORD: postgres
        run: bash scripts/lint-no-secdef-public-grant.sh

      # Seeds run AFTER migrations, and their INSERTs are ON CONFLICT DO NOTHING,
      # so an `UPDATE prompt_templates … simulation_id IS NULL` in a migration
      # matches zero rows on a fresh database and is silently discarded. This
      # replays those statements against the state the step above produced and
      # fails if any of them would still change a value — which means the seed
      # does not carry that migration. Migration 027 was inert this way for six
      # months. Must run AFTER migrations and seeds have both been applied.
      - name: Seed carries every platform prompt-template migration
        env:
          PGPASSWORD: postgres
        run: PGHOST=localhost PGPORT=54322 bash scripts/lint-seed-carries-migration-effects.sh

      # `.maybe_single()` verlangt 0 oder 1 Zeile. Trifft es zwei, verschluckt
      # postgrest-py den Originalfehler und wirft ein nichtssagendes
      # "Missing response". Das Tor prueft je Aufrufstelle, ob die Filterspalten
      # einen eindeutigen Index VOLL abdecken (oder `.limit(1)` dabeisteht) —
      # es braucht dafuer die Indexdefinitionen, also die migrierte Datenbank.
      # Anlass: Sentry METAVERSE_CENTER-4B, 02.09.2026.
      - name: maybe_single() trifft hoechstens eine Zeile
        env:
          PGPASSWORD: postgres
        run: PGHOST=localhost PGPORT=54322 bash scripts/lint-maybe-single-is-unique.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Content packs validation
        run: |
          python scripts/validate_content_packs.py
          python scripts/validate_content_packs.py --domain drift --strict

      - name: Run tests with coverage
        run: python -m pytest --cov

  sentry-release:
    name: Sentry Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-frontend, test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Associate commits & register deploy
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          inject: false
